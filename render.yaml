services:
  - type: web
    name: khushii-crm-api
    runtime: node
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @khushii/api build
    startCommand: pnpm --filter @khushii/api start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: WEBHOOK_SHARED_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: WORDPRESS_SITE_URL
        value: https://khushiideveloper.com
  - type: worker
    name: khushii-crm-reminders
    runtime: node
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @khushii/api build
    startCommand: pnpm --filter @khushii/api worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
